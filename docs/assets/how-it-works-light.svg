<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" width="900" height="330" role="img" aria-label="How it works: pick a face, give it a brain, it talks">
<style>
text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif;fill:#1F2328}
.t{font-size:19px;font-weight:700}
.s{font-size:13.5px;fill:#59636E}
.n{font-size:12px;font-weight:700;fill:#fff;letter-spacing:.5px}
.m{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace;font-size:12.5px;fill:#1F2328}
.chip{font-size:13px;font-weight:600;fill:#1F2328}
.flow{stroke-dasharray:6 7;animation:flow 1.2s linear infinite}
@keyframes flow{to{stroke-dashoffset:-26}}
.bar{transform-box:fill-box;transform-origin:center;animation:talk 1s ease-in-out infinite}
@keyframes talk{0%,100%{transform:scaleY(.35)}50%{transform:scaleY(1)}}
.blink{animation:blink 2.4s ease-in-out infinite}
@keyframes blink{0%,100%{opacity:.35}50%{opacity:1}}
.pkt{animation:pkt 2.4s ease-in-out infinite}
@keyframes pkt{0%{transform:translateX(0);opacity:0}10%{opacity:1}90%{opacity:1}100%{transform:translateX(var(--d));opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<defs>
<linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#004AFF"/><stop offset="1" stop-color="#7A5CFF"/></linearGradient>
</defs>
<rect x="0.0" y="20" width="260" height="200" rx="18" fill="#F6F8FF" stroke="#D3DDFB"/>
<rect x="20.0" y="40" width="26" height="26" rx="13" fill="url(#g)"/><text class="n" x="33.0" y="57.5" text-anchor="middle">1</text>
<g>
<circle cx="130.0" cy="92" r="34" fill="#E6EDFF"/>
<circle cx="130.0" cy="85" r="13" fill="url(#g)"/>
<path d="M109.0 117 a21 17 0 0 1 42 0" fill="url(#g)"/>
<circle cx="125.5" cy="84" r="1.8" fill="#fff"/><circle cx="134.5" cy="84" r="1.8" fill="#fff"/>
</g>
<text class="t" x="130.0" y="158" text-anchor="middle">Pick a face</text>
<text class="s" x="130.0" y="184" text-anchor="middle">Avatar, scene and voice from</text>
<text class="s" x="130.0" y="203" text-anchor="middle">the catalog, or your own .vrm</text>
<path class="flow" d="M268.0 120.0 H312.0" stroke="#004AFF" stroke-width="2.5" fill="none" stroke-linecap="round"/>
<path d="M306.0 114.0 L314.0 120.0 L306.0 126.0" stroke="#004AFF" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="320.0" y="20" width="260" height="200" rx="18" fill="#F6F8FF" stroke="#D3DDFB"/>
<rect x="340.0" y="40" width="26" height="26" rx="13" fill="url(#g)"/><text class="n" x="353.0" y="57.5" text-anchor="middle">2</text>
<g>
<circle cx="450.0" cy="92" r="34" fill="#E6EDFF"/>
<path d="M430.0 78 h40 a6 6 0 0 1 6 6 v20 a6 6 0 0 1 -6 6 h-24 l-10 9 v-9 h-6 a6 6 0 0 1 -6 -6 v-20 a6 6 0 0 1 6 -6z" fill="url(#g)"/>
<circle cx="441.0" cy="94" r="2.6" fill="#fff" class="blink"/>
<circle cx="450.0" cy="94" r="2.6" fill="#fff" class="blink" style="animation-delay:.3s"/>
<circle cx="459.0" cy="94" r="2.6" fill="#fff" class="blink" style="animation-delay:.6s"/>
</g>
<text class="t" x="450.0" y="158" text-anchor="middle">Give it a brain</text>
<text class="s" x="450.0" y="184" text-anchor="middle">A Perxona chatbot with persona</text>
<text class="s" x="450.0" y="203" text-anchor="middle">and knowledge, or your own LLM</text>
<path class="flow" d="M588.0 120.0 H632.0" stroke="#004AFF" stroke-width="2.5" fill="none" stroke-linecap="round"/>
<path d="M626.0 114.0 L634.0 120.0 L626.0 126.0" stroke="#004AFF" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="640.0" y="20" width="260" height="200" rx="18" fill="#F6F8FF" stroke="#D3DDFB"/>
<rect x="660.0" y="40" width="26" height="26" rx="13" fill="url(#g)"/><text class="n" x="673.0" y="57.5" text-anchor="middle">3</text>
<g><circle cx="770.0" cy="92" r="34" fill="#E6EDFF"/><rect class="bar" style="animation-delay:0s" x="751.5" y="85.0" width="5" height="14" rx="2.5" fill="url(#g)"/><rect class="bar" style="animation-delay:0.15s" x="759.5" y="79.0" width="5" height="26" rx="2.5" fill="url(#g)"/><rect class="bar" style="animation-delay:0.3s" x="767.5" y="74.0" width="5" height="36" rx="2.5" fill="url(#g)"/><rect class="bar" style="animation-delay:0.45s" x="775.5" y="81.0" width="5" height="22" rx="2.5" fill="url(#g)"/><rect class="bar" style="animation-delay:0.6s" x="783.5" y="86.0" width="5" height="12" rx="2.5" fill="url(#g)"/></g>
<text class="t" x="770.0" y="158" text-anchor="middle">It talks</text>
<text class="s" x="770.0" y="184" text-anchor="middle">Lip-sync, emotions and gestures,</text>
<text class="s" x="770.0" y="203" text-anchor="middle">from one present() call</text>
<text class="s" x="450.0" y="260" text-anchor="middle">Runs anywhere a web view runs</text>
<rect x="154.8" y="274" width="87.19999999999999" height="32" rx="16" fill="#FFFFFF" stroke="#D3DDFB"/>
<circle cx="170.8" cy="290" r="3.5" fill="#004AFF" class="blink"/>
<text class="chip" x="204.4" y="294.5" text-anchor="middle">Website</text>
<rect x="254.0" y="274" width="117.6" height="32" rx="16" fill="#FFFFFF" stroke="#D3DDFB"/>
<circle cx="270.0" cy="290" r="3.5" fill="#004AFF" class="blink"/>
<text class="chip" x="318.8" y="294.5" text-anchor="middle">Desktop app</text>
<rect x="383.6" y="274" width="155.6" height="32" rx="16" fill="#FFFFFF" stroke="#D3DDFB"/>
<circle cx="399.6" cy="290" r="3.5" fill="#004AFF" class="blink"/>
<text class="chip" x="467.40000000000003" y="294.5" text-anchor="middle">Chrome extension</text>
<rect x="551.2" y="274" width="72.0" height="32" rx="16" fill="#FFFFFF" stroke="#D3DDFB"/>
<circle cx="567.2" cy="290" r="3.5" fill="#004AFF" class="blink"/>
<text class="chip" x="593.2" y="294.5" text-anchor="middle">Kiosk</text>
<rect x="635.2" y="274" width="110.0" height="32" rx="16" fill="#FFFFFF" stroke="#D3DDFB"/>
<circle cx="651.2" cy="290" r="3.5" fill="#004AFF" class="blink"/>
<text class="chip" x="696.2" y="294.5" text-anchor="middle">Mobile web</text>
</svg>