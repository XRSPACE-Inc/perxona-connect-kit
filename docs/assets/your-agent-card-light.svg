<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="600" height="360" role="img" aria-label="Your agent here">
<style>
text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif;fill:#1F2328}
.t{font-size:19px;font-weight:700}
.s{font-size:13.5px;fill:#59636E}
.n{font-size:12px;font-weight:700;fill:#fff;letter-spacing:.5px}
.m{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace;font-size:12.5px;fill:#1F2328}
.chip{font-size:13px;font-weight:600;fill:#1F2328}
.flow{stroke-dasharray:6 7;animation:flow 1.2s linear infinite}
@keyframes flow{to{stroke-dashoffset:-26}}
.bar{transform-box:fill-box;transform-origin:center;animation:talk 1s ease-in-out infinite}
@keyframes talk{0%,100%{transform:scaleY(.35)}50%{transform:scaleY(1)}}
.blink{animation:blink 2.4s ease-in-out infinite}
@keyframes blink{0%,100%{opacity:.35}50%{opacity:1}}
.pkt{animation:pkt 2.4s ease-in-out infinite}
@keyframes pkt{0%{transform:translateX(0);opacity:0}10%{opacity:1}90%{opacity:1}100%{transform:translateX(var(--d));opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style><defs>
<linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#004AFF"/><stop offset="1" stop-color="#7A5CFF"/></linearGradient>
</defs>
<rect x="6" y="6" width="588" height="348" rx="24" fill="#F6F8FF" stroke="#004AFF" stroke-width="2.5" stroke-dasharray="10 9" class="flow" style="animation-duration:3s"/>
<circle cx="300.0" cy="150" r="72" fill="#E6EDFF"/>
<circle cx="300.0" cy="132" r="27" fill="url(#g)"/>
<path d="M256.0 202 a44 35 0 0 1 88 0" fill="url(#g)"/>
<circle cx="356.0" cy="96" r="22" fill="#004AFF"/>
<path d="M356.0 85 v22 M345.0 96 h22" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
<text class="t" x="300.0" y="285" text-anchor="middle" style="font-size:40px">Your agent here</text>
</svg>