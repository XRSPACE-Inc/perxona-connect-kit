    ConnectPresentationRequest:
      properties:
        avatar_id:
          type: string
          maxLength: 26
          minLength: 26
          title: Avatar Id
          description: Avatar asset ID used to load presentation assets for this request.
        voice_id:
          anyOf:
            - type: string
              maxLength: 26
              minLength: 26
              description: A valid ULID string
            - type: 'null'
          title: Voice Id
          description: >-
            Custom voice ID used to format the speech payload. Omit for BYO TTS mode: no speech synthesis runs and
            speech_format is returned as unknown.
        message:
          type: string
          maxLength: 2048
          minLength: 1
          title: Message
          description: Text that the presenter should speak.
        emotion:
          anyOf:
            - $ref: '#/components/schemas/EmotionCategory'
            - type: 'null'
          description: >-
            Emotional tone of the message. Drives facial-expression selection for the suggested motions; when both
            emotion and intensity are omitted, no facial expression is attached.
        intensity:
          anyOf:
            - $ref: '#/components/schemas/IntensityCategory'
            - type: 'null'
          description: >-
            Intensity of the emotional tone. Drives facial-expression selection for the suggested motions; when both
            emotion and intensity are omitted, no facial expression is attached.
      type: object
      required:
        - avatar_id
        - message
      title: ConnectPresentationRequest
      description: Request to generate a presenter payload for a plain text message.
    ConnectPresentationResponse:
      properties:
        performance_manifest:
          additionalProperties:
            $ref: '#/components/schemas/AssetManifestEntry'
          type: object
          title: Performance Manifest
          description: Motion assets selected for this presentation request.
        dropped_motion_ids:
          items:
            type: string
          type: array
          title: Dropped Motion Ids
          description: >-
            Motion/facial ids from the request message's [MOTION ...] marks that were not accepted (the asset is
            unknown, not shared with this organization, or lacks a required engine tag): their marks remain in the
            returned text and performance_manifest carries no entry for them. This reports gate refusals only, not
            playability — an accepted id whose asset has no uploaded LOD files is absent from this list yet its manifest
            entry carries only null URLs. A drop is a persistent data condition — the same id keeps being dropped until
            the asset's tags or sharing change; fix the asset rather than retrying. Always empty when the message
            carried no marks (server-suggested motion).
        display_text:
          type: string
          title: Display Text
          description: >-
            Clean, displayable text for UI elements (e.g., subtitles or chat bubbles). All vocal instructions and motion
            markers have been stripped.
        presentation:
          type: string
          title: Presentation
          description: Spoken text before SSML conversion, preserving motion marks for downstream consumers.
        speech_content:
          anyOf:
            - type: string
            - type: 'null'
          title: Speech Content
          description: >-
            The formatted payload for the speech synthesis engine. Depending on the active voice profile, this may
            contain specific acoustic markup (such as SSML tags or bracketed prompts) to control intonation and pacing.
            Null in BYO TTS mode (request omitted voice_id); clients should read display_text instead.
        speech_format:
          $ref: '#/components/schemas/SpeechFormat'
          description: 'Speech content format: raw_text, ssml, markup, or unknown (BYO TTS mode).'
        language:
          type: string
          title: Language
          description: Language code (e.g. 'en', 'zh').
        voice_name:
          anyOf:
            - type: string
            - type: 'null'
          title: Voice Name
          description: >-
            Identifier for the voice model used by the presenter widget. Null in BYO TTS mode (request omitted
            voice_id).
        posture_style:
          anyOf:
            - $ref: '#/components/schemas/PostureStyle'
            - type: 'null'
          description: >-
            Turn-level emotion posture style for the 3D avatar: the client applies a small persistent rotation-only
            posture offset (spine/shoulder/head) on top of whatever gesture clip plays. ``null`` means no posture
            styling for this performance; ``intensity=neutral`` is a medium gain, NOT 'no posture'. Connect note: this
            is the EFFECTIVE style resolved against the org's emotion-posture flag — NOT an echo of the request; null
            when the flag is off or the request carried no emotion.
      type: object
      required:
        - dropped_motion_ids
        - display_text
        - presentation
        - speech_content
        - speech_format
        - language
        - voice_name
        - posture_style
      title: ConnectPresentationResponse
      description: Presentation payload returned to Connect SDK consumers.
