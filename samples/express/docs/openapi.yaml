    ConnectVRMSkeletonType:
      type: string
      enum:
        - male
        - female
        - male_three_head
        - female_three_head
      title: ConnectVRMSkeletonType
      description: |-
        The motion style a VRM avatar draws its gestures from.

        A style choice, not a technical constraint: a clip from any of these pools is retargeted
        onto the uploaded VRM's own rig, so picking the wrong one yields gestures in the wrong
        style rather than a playback failure.

        The three-head values select the 3-head-tall proportions, authored as a separate motion
        lineage. The plain male and female values select the 8-head-tall lineage, which is where
        most of the pool lives.
    ConnectVRMUploadResponse:
      properties:
        avatar_id:
          type: string
          title: Avatar Id
      type: object
      required:
        - avatar_id
      title: ConnectVRMUploadResponse
      description: |-
        Result of a successful VRM upload: the active avatar's asset ID.

        Only `avatar_id` is returned, matching the existing Connect API convention
        (``ConnectListAvatarResponse``/``ConnectAvatarDetailResponse``) of never
        exposing internal revision IDs to Connect clients.
