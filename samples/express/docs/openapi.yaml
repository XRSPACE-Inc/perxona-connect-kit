      properties:
        avatar:
          anyOf:
            - $ref: '#/components/schemas/AvatarRuntimeConfig-Output'
            - type: 'null'
      type: object
      title: ConnectAvatarRuntimeConfigs
      description: |-
        Runtime config surface for Connect avatar-facing endpoints.

        Scoped to the `avatar` namespace only: every asset this endpoint serves is AVATAR-typed,
        and `validate_asset_configs` forbids any other namespace from ever being set on one — so
        exposing the full `AssetRuntimeConfigs` shape here would mean every future namespace (e.g.
        `motion`) permanently answers `null` to a Connect partner that can never receive it.

        This narrowing applies only to avatar-specific endpoints. `connect/presentation`'s
        `performance_manifest` deliberately keeps the shared `AssetManifestEntry` instead — REST
        `get_asset_lod_urls`, the Chat WebSocket manifest and Connect's performance manifest all
        carry the same wire type, so `configs.avatar` sits permanently null on a motion entry there.
        That is the cost of one wire type across every surface that emits a manifest entry rather
        than a Connect-specific one.
