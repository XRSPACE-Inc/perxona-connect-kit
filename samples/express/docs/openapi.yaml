    PostureStyle:
      $defs:
        EmotionCategory:
          description: |-
            The 13-way agent-side vocabulary — what the AGENT expresses in a turn.

            The values are wire and storage contracts: motion assets are tagged with them, stored
            emotion mappings answer with them, and the Suggest request's ``turn_base_emotion``
            carries one. Member order is the order the CMS lists them in.
          enum:
            - joy
            - excitement
            - admiration
            - caring
            - gratitude
            - sadness
            - disappointment
            - annoyance
            - embarrassment
            - curiosity
            - surprise
            - realization
            - confusion
          title: EmotionCategory
          type: string
        IntensityCategory:
          description: How strongly the agent expresses an ``EmotionCategory``.
          enum:
            - low
            - neutral
            - high
          title: IntensityCategory
          type: string
      description: 'The emotion posture for one performance: which emotion styles the avatar''s body posture, and how strongly.'
      properties:
        emotion:
          $ref: '#/components/schemas/EmotionCategory'
          description: Canonical turn-level emotion driving the posture envelope.
        intensity:
          $ref: '#/components/schemas/IntensityCategory'
          description: Posture gain tier; ``neutral`` is medium, not off.
      required:
        - emotion
        - intensity
      title: PostureStyle
      type: object
    SceneThumbnailType:
      type: string
      enum:
        - default
        - high_res
        - loading
      title: SceneThumbnailType
      description: The type of thumbnail for a scene asset
    SettingsEnvelope:
      properties:
        version:
          type: integer
          maximum: 9007199254740991
          exclusiveMinimum: 0
          title: Version
        payload:
          additionalProperties: true
          type: object
          title: Payload
      additionalProperties: false
      type: object
      required:
        - version
        - payload
      title: SettingsEnvelope
      description: |-
        A versioned, opaque settings payload owned entirely by the frontend.

        The backend never interprets `payload` — it only validates the envelope shape here and
        storage limits (depth/bytes/key-count) at the request layer (`_validate_runtime_settings`).
        `version` must be a real positive integer: bool is rejected even though `bool` is an `int`
        subtype, and so are str/float, because this field round-trips through frontend JS.
    SortDirection:
      type: string
      enum:
        - asc
        - desc
      title: SortDirection
      description: The sort direction
    SpeechFormat:
      type: string
      enum:
        - raw_text
        - ssml
        - markup
        - unknown
      title: SpeechFormat
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
              - type: string
              - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
      type: object
      required:
        - loc
        - msg
        - type
      title: ValidationError
    VoiceProvider:
      type: string
      enum:
        - google
        - aws
        - azure
        - elevenlabs
      title: VoiceProvider
    VoiceRegion:
      type: string
      enum:
        - none
        - southeastasia
        - westeurope
        - eastus
        - westus
        - japaneast
      title: VoiceRegion
      description: |-
        This enum represents the different regions where voice models can be deployed.
        It must match the provider Location/Region names because the Speech Cognitive API uses these names.
